<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<title>Panel</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<section class="bienvenidos">

<div class="marco">

<h2>Panel de Administración</h2>

<div class="adorno">
<span></span>
<span class="rombo">◆</span>
<span></span>
</div>

<div id="estadisticas"></div>
<div class="agregar-familia">

    <h3>Agregar familia</h3>

    <input
        type="text"
        id="nombreFamilia"
        class="input-confirmar"
        placeholder="Nombre de la familia"
    >

    <div id="listaInvitados">

        <input
            type="text"
            class="input-confirmar invitado-input"
            placeholder="Nombre del invitado"
        >

    </div>

    <button
        type="button"
        class="btn-evento"
        onclick="agregarCampoInvitado()"
    >
        + Agregar invitado
    </button>

    <button
        type="button"
        class="btn-evento"
        onclick="guardarFamilia()"
    >
        Guardar familia
    </button>

    <p id="mensajeFamilia"></p>

</div>

<br>
<input
    type="text"
    id="buscador"
    class="input-confirmar"
    placeholder="Buscar familia..."
    onkeyup="filtrarFamilias()"
>

<br><br>

<div class="filtros">

    <button onclick="mostrarTodas()">
        Todas
    </button>

    <button onclick="filtrarEstado('Pendiente')">
        🔴 Pendientes
    </button>

    <button onclick="filtrarEstado('Parcial')">
        🟡 Parciales
    </button>

    <button onclick="filtrarEstado('Completa')">
        🟢 Completas
    </button>

</div>

<br>

<br>

<table id="tabla" style="width:100%;border-collapse:collapse;"></table>

</div>

</section>

<script src="panel.js"></script>

</body>

</html>
